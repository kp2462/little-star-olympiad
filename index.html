
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captain Star's Quiz</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(#87CEFA,#FFE082);
padding:10px;
}
.card{
max-width:520px;
margin:auto;
background:white;
border-radius:30px;
padding:20px;
box-shadow:0 6px 20px rgba(0,0,0,.2);
}
h1{text-align:center;font-size:32px}
#stars{text-align:center;font-size:24px}
#question{font-size:30px;text-align:center;font-weight:bold;margin:15px 0}
#pic{text-align:center;font-size:100px}
.opt{
width:100%;
padding:18px;
margin:10px 0;
border:none;
border-radius:20px;
font-size:24px;
font-weight:bold;
cursor:pointer;
}
#a{background:#F48FB1}
#b{background:#81D4FA}
#c{background:#A5D6A7}
#d{background:#FFE082}
#msg{text-align:center;font-size:24px;min-height:40px}
</style>
</head>
<body>
<div class="card">
<h1>🚀 Captain Star's Quiz</h1>
<div id="stars">⭐⭐⭐⭐⭐</div>
<div id="question"></div>
<div id="pic"></div>
<div id="options"></div>
<div id="msg"></div>
</div>

<script>
const quiz=[
{q:"Who is taller?",pic:"🦒",o:["Rabbit","Cat","Giraffe","Dog"],a:2},
{q:"Which glass is empty?",pic:"🫙",o:["Milk","Juice","Empty Jar","Tea"],a:2},
{q:"Which animal is fastest?",pic:"🐆",o:["Snail","Cheetah","Turtle","Cow"],a:1},
{q:"Which is smaller?",pic:"🐜",o:["Elephant","Bus","Ant","Whale"],a:2},
{q:"Which is heavier?",pic:"🍉",o:["Leaf","Feather","Watermelon","Bubble"],a:2},
{q:"What comes after 17?",pic:"🔢",o:["16","18","19","20"],a:1},
{q:"What comes before 30?",pic:"🔢",o:["28","31","29","27"],a:2},
{q:"Count: ⭐⭐⭐⭐⭐⭐⭐⭐",pic:"⭐",o:["6","7","8","9"],a:2},
{q:"Arrange: 9,2,5",pic:"📈",o:["2,5,9","9,5,2","5,9,2","2,9,5"],a:0},
{q:"Which shape has 3 sides?",pic:"🔺",o:["Circle","Triangle","Square","Heart"],a:1}
];

let i=0;
function load(){
let x=quiz[i];
question.innerText=`Question ${i+1}: `+x.q;
pic.innerText=x.pic;
msg.innerText="";
options.innerHTML="";
["a","b","c","d"].forEach((id,idx)=>{
let b=document.createElement("button");
b.className="opt";
b.id=id;
b.innerText=String.fromCharCode(65+idx)+". "+x.o[idx];
b.onclick=()=>check(idx);
options.appendChild(b);
});
}
function check(n){
if(n===quiz[i].a){
msg.innerText="🎉 Great Job!";
}else{
msg.innerText="😊 Nice Try!";
}
setTimeout(()=>{
i++;
if(i<quiz.length){load();}
else{
document.querySelector(".card").innerHTML=
"<h1>🏆 You Finished!</h1><h2>Captain Star is proud of you!</h2>";
}
},1000);
}
load();
</script>
</body>
</html>
