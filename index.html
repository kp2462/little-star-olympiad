
<!doctype html>
<html><head><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Little Star Olympiad</title>
<style>
body{font-family:Arial;margin:0;background:linear-gradient(#87CEEB,#d8e64f);padding:10px}
.card{max-width:520px;margin:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 4px 10px #999}
h1,h2{text-align:center}
button{width:100%;padding:15px;margin:8px 0;border:none;border-radius:15px;font-size:18px}
#pic{font-size:90px;text-align:center}
#progress{height:20px;background:#eee;border-radius:10px;overflow:hidden}
#bar{height:100%;background:#4caf50;width:0%}
#next{display:none;background:#333;color:#fff}
</style></head>
<body>
<div class='card'>
<h1>🌟 Little Star Olympiad 🌟</h1>
<div id='progress'><div id='bar'></div></div>
<p id='status'></p>
<h2 id='q'></h2>
<div id='pic'></div>
<div id='opts'></div>
<p id='msg'></p>
<button id='next' onclick='nq()'>Next ➡️</button>
</div>
<script>
const quiz=[{"cat": "Comparing", "q": "Who is bigger?", "pic": "\ud83d\udc18", "opts": ["Ant", "Elephant", "Mouse", "Bird"], "a": 1}, {"cat": "Comparing", "q": "Who is taller?", "pic": "\ud83e\udd92", "opts": ["Rabbit", "Cat", "Giraffe", "Dog"], "a": 2}, {"cat": "Comparing", "q": "Which is heavier?", "pic": "\ud83c\udf49", "opts": ["Feather", "Leaf", "Watermelon", "Balloon"], "a": 2}, {"cat": "Comparing", "q": "Which glass is empty?", "pic": "\ud83e\uded9", "opts": ["Milk", "Juice", "Empty Jar", "Tea"], "a": 2}, {"cat": "Comparing", "q": "Find the odd one out", "pic": "\ud83c\udf4e", "opts": ["Apple", "Banana", "Car", "Mango"], "a": 2}, {"cat": "Numbers", "q": "What comes after 14?", "pic": "\ud83d\udd22", "opts": ["13", "15", "16", "17"], "a": 1}, {"cat": "Numbers", "q": "What comes before 20?", "pic": "\ud83d\udd22", "opts": ["19", "18", "21", "17"], "a": 0}, {"cat": "Numbers", "q": "Count: \u2b50\u2b50\u2b50\u2b50\u2b50\u2b50\u2b50", "pic": "\u2b50", "opts": ["5", "6", "7", "8"], "a": 2}, {"cat": "Numbers", "q": "Which is greater?", "pic": "1\ufe0f\u20e32\ufe0f\u20e3", "opts": ["12", "9", "8", "7"], "a": 0}, {"cat": "Numbers", "q": "Number name of 8", "pic": "8\ufe0f\u20e3", "opts": ["Nine", "Eight", "Six", "Ten"], "a": 1}, {"cat": "Arrange", "q": "Arrange: 7,3,5", "pic": "\ud83d\udcc8", "opts": ["3,5,7", "7,5,3", "5,7,3", "3,7,5"], "a": 0}, {"cat": "Arrange", "q": "Arrange: 2,9,6 (descending)", "pic": "\ud83d\udcc9", "opts": ["2,6,9", "6,9,2", "9,6,2", "9,2,6"], "a": 2}, {"cat": "Arrange", "q": "Fill: 29,__,31", "pic": "\ud83d\ude82", "opts": ["28", "30", "32", "33"], "a": 1}, {"cat": "Arrange", "q": "Next: 21,22,23,__", "pic": "\ud83d\ude82", "opts": ["24", "25", "26", "27"], "a": 0}, {"cat": "Arrange", "q": "Smallest: 8,2,5", "pic": "\ud83d\udd22", "opts": ["8", "2", "5", "1"], "a": 1}, {"cat": "Shapes", "q": "Which shape has 3 sides?", "pic": "\ud83d\udd3a", "opts": ["Circle", "Triangle", "Square", "Heart"], "a": 1}, {"cat": "Shapes", "q": "Which shape looks like a ball?", "pic": "\u26bd", "opts": ["Cube", "Sphere", "Cone", "Cuboid"], "a": 1}, {"cat": "Shapes", "q": "Birthday cap shape?", "pic": "\ud83c\udf89", "opts": ["Cone", "Sphere", "Cube", "Cylinder"], "a": 0}, {"cat": "Shapes", "q": "Which has 4 equal sides?", "pic": "\u2b1c", "opts": ["Rectangle", "Heart", "Square", "Star"], "a": 2}, {"cat": "Shapes", "q": "Ice cream cone shape?", "pic": "\ud83c\udf66", "opts": ["Cone", "Cube", "Circle", "Sphere"], "a": 0}];
let i=0,score=0;
function beep(ok){
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 const o=ctx.createOscillator(); const g=ctx.createGain();
 o.connect(g);g.connect(ctx.destination);
 o.frequency.value=ok?880:220;o.start();
 g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.4);
 o.stop(ctx.currentTime+.4);
}
function load(){
 let x=quiz[i];
 status.innerText=`Question ${i+1}/${quiz.length} | Stars: ${score}`;
 bar.style.width=((i/quiz.length)*100)+'%';
 q.innerText=x.q; pic.innerText=x.pic; msg.innerText='';
 next.style.display='none'; opts.innerHTML='';
 x.opts.forEach((o,idx)=>{
   let b=document.createElement('button');
   b.innerText=String.fromCharCode(65+idx)+'. '+o;
   b.onclick=()=>check(idx);
   opts.appendChild(b);
 });
}
function check(c){
 document.querySelectorAll('#opts button').forEach(b=>b.disabled=true);
 if(c===quiz[i].a){score++;msg.innerText='🎉 Correct!';beep(true);}
 else{msg.innerText='😊 Correct answer: '+quiz[i].opts[quiz[i].a];beep(false);}
 next.style.display='block';
}
function nq(){
 i++;
 if(i<quiz.length)load();
 else document.querySelector('.card').innerHTML=`<h1>🏆 Finished!</h1><h2>${score}/${quiz.length}</h2><p>${score>=15?'Little Star Champion!':'Great Effort!'}`;
}
load();
</script></body></html>
